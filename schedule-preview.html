<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Woolink | 話せる時間（プレビュー）</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
  background: #0a1230;
}

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}

.phone {
  position: relative;
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(120% 60% at 50% 100%, #48619a 0%, #223464 45%, #0d1442 100%);
  color: #eef0fb;
  display: flex;
  flex-direction: column;
}

/* ---------- Header ---------- */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  background: #0a1140;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}

.brand-name {
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.02em;
  color: #f3f4fb;
}

.menu-btn {
  width: 32px;
  height: 26px;
  background: none;
  border: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
}

.menu-btn span {
  display: block;
  height: 2.5px;
  width: 100%;
  background: #eef0fb;
  border-radius: 2px;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.menu-btn.open span:nth-child(1) { transform: translateY(11px) rotate(45deg); }
.menu-btn.open span:nth-child(2) { opacity: 0; }
.menu-btn.open span:nth-child(3) { transform: translateY(-11px) rotate(-45deg); }

/* ---------- Dropdown menu ---------- */

.menu-panel {
  position: absolute;
  top: 62px;
  right: 16px;
  z-index: 20;
  width: 200px;
  background: #f7f6f2;
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  padding: 6px;
  display: flex;
  flex-direction: column;
}

.menu-panel[hidden] {
  display: none;
}

.menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 14px;
  color: #2b2b3a;
  text-decoration: none;
  font-size: 14.5px;
  border-radius: 10px;
}

.menu-item:not(:last-child) {
  border-bottom: 1px solid #e7e5dd;
  border-radius: 10px 10px 0 0;
}

.menu-item:active,
.menu-item:hover {
  background: #ece9e1;
}

.menu-item svg {
  color: #9c9a90;
  flex-shrink: 0;
}

/* ---------- Content ---------- */

.content {
  padding: 22px 20px 0;
  flex: 1;
}

.friend-card {
  background: rgba(20, 28, 62, 0.55);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 16px 18px;
  text-align: center;
}

.friend-card h1 {
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 700;
  color: #cfd3f0;
}

.friend-card p {
  margin: 0;
  font-size: 12px;
  line-height: 1.7;
  color: #b7bce0;
}

.actions {
  display: flex;
  gap: 16px;
  margin-top: 22px;
}

.action-tile {
  position: relative;
  flex: 1;
  aspect-ratio: 1 / 1;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
  box-shadow: 0 10px 22px rgba(0,0,0,0.25);
}

.action-tile.diary {
  background: linear-gradient(155deg, #6f7bf2 0%, #5762e0 60%, #4b57d6 100%);
}

.action-tile.call {
  background: rgba(35, 44, 82, 0.75);
  border: 1px solid rgba(255,255,255,0.06);
}

.tile-label {
  font-size: 13px;
  font-weight: 700;
  color: #f5f5fb;
}

.action-tile.call .tile-label {
  color: #8a90ad;
}

.badge {
  position: absolute;
  top: -8px;
  left: -8px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #f2c94c;
  border: 2px solid #0d1442;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  display: none;
}

.badge.is-visible {
  display: block;
}

/* ---------- Footer / mascot ---------- */

.mascot-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 24px 18px 26px;
  margin-top: auto;
}

.guide-bubble {
  position: relative;
  background: #e8e7e2;
  color: #2b2b3a;
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  padding: 12px 22px;
  border-radius: 10px;
  margin-bottom: 18px;
}

.guide-bubble::after {
  content: "";
  position: absolute;
  left: -8px;
  bottom: 12px;
  border-width: 6px 8px 6px 0;
  border-style: solid;
  border-color: transparent #e8e7e2 transparent transparent;
}

/* ---------- Placeholder page ---------- */

.placeholder-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
  gap: 14px;
}

.placeholder-main h1 {
  font-size: 18px;
  color: #f3f4fb;
  margin: 0;
}

.placeholder-main p {
  font-size: 13px;
  color: #a9adcf;
  line-height: 1.8;
  margin: 0;
  max-width: 280px;
}

.placeholder-icon {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1px solid rgba(255,255,255,0.55);
  color: #eef0fb;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 12px 22px;
  border-radius: 999px;
  cursor: pointer;
  margin-top: 8px;
}

.back-btn:active {
  background: rgba(255,255,255,0.1);
}

/* ---------- Back button (bottom, centered) ---------- */

.back-btn-wrap {
  display: flex;
  justify-content: center;
  padding: 28px 0 20px;
}

/* ---------- Date picker (schedule screen) ---------- */

.date-picker {
  padding: 4px 0 18px;
}

.date-picker-header {
  font-size: 13px;
  font-weight: 700;
  color: #dfe1f2;
  margin-bottom: 14px;
}

.date-picker-row {
  display: flex;
  justify-content: space-between;
  gap: 6px;
}

.date-chip {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
  color: inherit;
}

.date-caption {
  font-size: 9px;
  font-weight: 700;
  color: #f2c94c;
  height: 11px;
  line-height: 11px;
}

.date-num {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: #eef0fb;
  background: transparent;
  border: 2px dashed rgba(255,255,255,0.4);
}

.date-chip.has-schedule .date-num {
  background: #f6ecc4;
  color: #3a3620;
  border: 2px solid #f6ecc4;
}

.date-chip.is-selected .date-num {
  box-shadow: 0 0 0 2px #f2c94c;
  border-color: transparent;
}

.date-weekday {
  font-size: 12px;
  color: #9296b8;
  padding: 3px 9px;
  border-radius: 999px;
}

.date-chip.is-selected .date-weekday {
  background: #f2c94c;
  color: #3a3620;
  font-weight: 700;
}

/* ---------- Schedule card ---------- */

.schedule-card {
  background: rgba(255,255,255,0.14);
  border-radius: 16px;
  padding: 18px 18px 20px;
}

.schedule-card h1 {
  margin: 0 0 20px;
  font-size: 14px;
  font-weight: 700;
  color: #eef0fb;
}

.schedule-empty {
  text-align: center;
  font-size: 13px;
  color: #c7cae4;
  margin: 0 0 18px;
}

.schedule-list {
  list-style: none;
  margin: 0 0 16px;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.schedule-list li {
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  color: #eef0fb;
  font-weight: 700;
  text-align: center;
}

.schedule-btn {
  display: block;
  text-align: center;
  background: linear-gradient(135deg, #6f7bf2 0%, #4b57d6 100%);
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
  padding: 14px;
  border-radius: 12px;
}

.schedule-btn-secondary {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.3);
}


.hidden { display: none !important; }
</style>
</head>
<body>


<div class="phone">

<div id="scheduleView">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="#f4c95d"/>
        <circle cx="14" cy="18" r="2.4" fill="#2a2550"/>
        <circle cx="26" cy="18" r="2.4" fill="#2a2550"/>
        <path d="M14 25 Q20 29 26 25" stroke="#2a2550" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Woolink</span>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="メニューを開く" aria-expanded="false" aria-controls="menuPanel">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="menu-panel" id="menuPanel" hidden>
    <a class="menu-item" data-title="プロフィール">
      <span>プロフィール</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" data-title="お知らせ">
      <span>お知らせ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" data-title="設定">
      <span>設定</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" data-title="ヘルプ">
      <span>ヘルプ</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="menu-item" data-title="ログアウト">
      <span>ログアウト</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </nav>

  <main class="content">
    <section class="date-picker">
      <div class="date-picker-header" id="dateHeader">-- 年 -- 月</div>
      <div class="date-picker-row" id="dateRow"></div>
    </section>

    <section class="schedule-card">
      <h1 id="scheduleTitle">話せる時間</h1>
      <div id="scheduleBody"></div>
    </section>

    <div class="back-btn-wrap">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        戻る
      </button>
    </div>
  </main>
</div>

  <div id="placeholderView" class="hidden">
    <header class="topbar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="#f4c95d"/>
          <circle cx="14" cy="18" r="2.4" fill="#2a2550"/>
          <circle cx="26" cy="18" r="2.4" fill="#2a2550"/>
          <path d="M14 25 Q20 29 26 25" stroke="#2a2550" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">Woolink</span>
      </div>
    </header>
    <main class="placeholder-main">
      <div class="placeholder-icon">
        <svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" stroke="#8a90ad" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      </div>
      <h1 id="phTitle">仮ページ</h1>
      <p>このページはまだ準備中です。ここに「<span id="phTitle2">この機能</span>」の画面が入る予定です。</p>
      <button class="back-btn" id="phBackBtn">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        戻る
      </button>
    </main>
  </div>

</div>

<script>
  /* ---------- 仮ページ表示の切り替え（プレビュー内のみ。実ファイルでは本当に別ページへ遷移） ---------- */
  const scheduleView = document.getElementById('scheduleView');
  const placeholderView = document.getElementById('placeholderView');
  const phTitle = document.getElementById('phTitle');
  const phTitle2 = document.getElementById('phTitle2');

  function goToPlaceholder(title) {
    phTitle.textContent = title;
    phTitle2.textContent = title;
    scheduleView.classList.add('hidden');
    placeholderView.classList.remove('hidden');
  }

  document.getElementById('phBackBtn').addEventListener('click', () => {
    placeholderView.classList.add('hidden');
    scheduleView.classList.remove('hidden');
  });

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-title]');
    if (el) {
      e.stopPropagation();
      goToPlaceholder(el.getAttribute('data-title'));
    }
  });

  /* ---------- 戻るボタン ---------- */
  document.getElementById('backBtn').addEventListener('click', () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'index.html';
    }
  });

  /* ---------- ハンバーガーメニュー ---------- */
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');

  menuBtn.addEventListener('click', () => {
    const isOpen = !menuPanel.hidden;
    menuPanel.hidden = isOpen;
    menuBtn.classList.toggle('open', !isOpen);
    menuBtn.setAttribute('aria-expanded', String(!isOpen));
  });

  document.addEventListener('click', (e) => {
    if (!menuPanel.hidden && !menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
      menuPanel.hidden = true;
      menuBtn.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    }
  });

  /* ---------- カレンダー：今週（月曜〜日曜）だけを表示 ---------- */
  const WEEKDAY_JA = ['月', '火', '水', '木', '金', '土', '日'];

  // 話せる時間の予定が入っている曜日（0=月 … 6=日）。実データに置き換える想定。
  const scheduleOffsets = [2, 4, 5];

  function getMonday(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    const day = d.getDay(); // 0=日,1=月,...6=土
    const diffToMonday = (day === 0 ? -6 : 1 - day);
    d.setDate(d.getDate() + diffToMonday);
    return d;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const monday = getMonday(today);
  const todayOffset = Math.round((today - monday) / 86400000);

  const weekDates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    weekDates.push(d);
  }

  const dateHeader = document.getElementById('dateHeader');
  const dateRow = document.getElementById('dateRow');
  const scheduleTitle = document.getElementById('scheduleTitle');
  const scheduleBody = document.getElementById('scheduleBody');

  dateHeader.textContent = today.getFullYear() + ' 年 ' + (today.getMonth() + 1) + ' 月';

  let selectedOffset = todayOffset;

  function renderCalendar() {
    dateRow.innerHTML = '';
    weekDates.forEach((d, i) => {
      const hasSchedule = scheduleOffsets.includes(i);
      const isToday = i === todayOffset;
      const isSelected = i === selectedOffset;

      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'date-chip' + (hasSchedule ? ' has-schedule' : '') + (isSelected ? ' is-selected' : '');
      chip.innerHTML =
        '<span class="date-caption">' + (isToday ? '今日' : '&nbsp;') + '</span>' +
        '<span class="date-num">' + d.getDate() + '</span>' +
        '<span class="date-weekday">' + WEEKDAY_JA[i] + '</span>';

      chip.addEventListener('click', () => {
        selectedOffset = i;
        renderCalendar();
        renderSchedule();
      });

      dateRow.appendChild(chip);
    });
  }

  function renderSchedule() {
    const d = weekDates[selectedOffset];
    scheduleTitle.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日　話せる時間';

    if (scheduleOffsets.includes(selectedOffset)) {
      scheduleBody.innerHTML =
        '<ul class="schedule-list"><li>20:00 〜 21:00</li></ul>' +
        '<button type="button" class="schedule-btn schedule-btn-secondary" data-title="新しく登録する">追加で登録する</button>';
    } else {
      scheduleBody.innerHTML =
        '<p class="schedule-empty">まだ予定がありません</p>' +
        '<button type="button" class="schedule-btn" data-title="新しく登録する">新しく登録する</button>';
    }
  }

  renderCalendar();
  renderSchedule();
</script>


</body>
</html>
